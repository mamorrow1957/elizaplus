# Reference nginx configuration for an elizaplus site (an example: replace the hostnames; docs, not deployed by CI).
# Two files: /etc/nginx/sites-enabled/elizaplus and /etc/nginx/conf.d/elizaplus-limits.conf. A test checks this copy's safety rules. Set resolver to your DNS server.

# ---- /etc/nginx/sites-enabled/elizaplus ----
server {
	listen 80;
	listen [::]:80;
	server_name elizaplus.example.com;
	root /var/www/elizaplus;
	index index.html;
	# Inner voice: same-origin proxy to an OpenAI-compatible server such as LM Studio (hostname resolved per request so a down model host never blocks nginx start/reload)
	location = /api/chat {
		limit_except POST { deny all; }
		client_max_body_size 8k;
		limit_req zone=elizaplus_chat burst=10 nodelay;
		limit_req_status 429;
		resolver 127.0.0.53 valid=60s ipv6=off;
		set $lmstudio lmstudio.example.lan;
		proxy_pass http://$lmstudio:1234/v1/chat/completions;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $lmstudio:1234;
		proxy_connect_timeout 3s;
		proxy_read_timeout 20s;
		proxy_buffering off;
		add_header Cache-Control "no-store" always;
	}

	location ~* \.(js|html)$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}
	location / {
		try_files $uri $uri/ =404;
	}
}

# ---- /etc/nginx/conf.d/elizaplus-limits.conf ----
# elizaplus: rate limit for the LLM proxy (all clients arrive via NPM, so this is one shared bucket)
limit_req_zone $server_name zone=elizaplus_chat:1m rate=60r/m;
