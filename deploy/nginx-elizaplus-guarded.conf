# Reference nginx configuration for an elizaplus site whose AI requests go through the guard (an example: replace the hostnames).
# Use this instead of nginx-elizaplus.conf when the site has user accounts. Files: /etc/nginx/sites-enabled/elizaplus and /etc/nginx/conf.d/elizaplus-limits.conf.
#
# Identity: the login layer in front (NPM with Authentik forward auth) puts the signed-in user's name in the
# X-Auth-User header. This server believes that header ONLY when the request comes from that proxy
# (the geo block below), so nobody can pick their own name. Anyone reaching this server directly is "lan".

# ---- /etc/nginx/conf.d/elizaplus-limits.conf ----
# Outer safety net on top of the guard's own per-user limits (all clients arrive via the proxy, so this is one shared bucket).
limit_req_zone $server_name zone=elizaplus_chat:1m rate=120r/m;

# The login proxy's address (nginx cannot resolve names inside a geo block; this is the one place an address is needed).
geo $from_login_proxy {
	default 0;
	192.0.2.10 1;
}
map "$from_login_proxy:$http_x_auth_user" $guard_user {
	"~^1:(?<name>[A-Za-z0-9@._+-]{1,100})$" $name;
	default "lan";
}

# ---- /etc/nginx/sites-enabled/elizaplus ----
server {
	listen 80;
	listen [::]:80;
	server_name elizaplus.example.com;
	root /var/www/elizaplus;
	index index.html;
	# AI requests: same-origin, through the guard (loopback only). The guard fixes the model, caps replies and limits each user.
	location = /api/chat {
		limit_except POST { deny all; }
		client_max_body_size 8k;
		limit_req zone=elizaplus_chat burst=20 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:3100/api/chat;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header X-Auth-User $guard_user;
		proxy_connect_timeout 3s;
		proxy_read_timeout 60s;
		proxy_buffering off;
		add_header Cache-Control "no-store" always;
	}

	location ~* \.(js|html)$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}
	location / {
		try_files $uri $uri/ =404;
	}
}
