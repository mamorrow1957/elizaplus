# Reference nginx site for the elizaplus splash page on the bare domain (an example: replace the hostname).
# Install as /etc/nginx/sites-enabled/elizaplus-site; scripts/deploy.sh publishes the repo's site/ folder to /var/www/elizaplus-site.
# nginx does NOT inherit server-level add_header into a location that has its own add_header, so every location repeats the security headers.
server {
	listen 80;
	listen [::]:80;
	server_name elizaplus.example.com;
	root /var/www/elizaplus-site;
	index index.html;

	location ~* \.(png|css)$ {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header Cache-Control "public, max-age=300";
		try_files $uri =404;
	}
	location / {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ =404;
	}
}
